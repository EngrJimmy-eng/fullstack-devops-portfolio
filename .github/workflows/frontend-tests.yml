name: Application CI

on:
  push:
    branches:
      - main
      - dev
      - staging
      - prod

  pull_request:
    branches:
      - main
      - dev
      - staging
      - prod

jobs:

  # ============================================================
  # FRONTEND TESTS
  # ============================================================
  frontend-tests:
    name: Frontend - Vitest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Build frontend
        run: npm run build


  # ============================================================
  # BACKEND TESTS
  # ============================================================
  backend-tests:
    name: Backend - Jest
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test


  # ============================================================
  # DOCKER BUILDS
  # ============================================================
  docker-builds:
    name: Docker Builds
    runs-on: ubuntu-latest

    needs:
      - frontend-tests
      - backend-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: |
          docker build \
            -t fullstack-devops-portfolio-frontend:ci \
            ./frontend

      - name: Build backend Docker image
        run: |
          docker build \
            -t fullstack-devops-portfolio-backend:ci \
            ./backend

      - name: Show Docker images
        run: docker images


  # ============================================================
  # DOCKER CONTAINER SMOKE TESTS
  # ============================================================
  docker-smoke-tests:
    name: Docker Smoke Tests
    runs-on: ubuntu-latest

    needs:
      - docker-builds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Each GitHub Actions job runs on a fresh runner.
      # Therefore the images from docker-builds must be rebuilt.
      # --------------------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t fullstack-devops-portfolio-frontend:ci \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t fullstack-devops-portfolio-backend:ci \
            ./backend

      # ========================================================
      # FRONTEND CONTAINER
      # ========================================================

      - name: Run frontend container
        run: |
          docker run -d \
            --name frontend-smoke \
            -p 8080:80 \
            fullstack-devops-portfolio-frontend:ci

      - name: Wait for frontend
        run: sleep 5

      - name: Smoke test frontend
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 2 \
            http://localhost:8080

      - name: Remove frontend container
        if: always()
        run: |
          docker rm -f frontend-smoke || true

      # ========================================================
      # BACKEND CONTAINER
      # ========================================================

      - name: Run backend container
        run: |
          docker run -d \
            --name backend-smoke \
            -p 5000:5000 \
            fullstack-devops-portfolio-backend:ci

      - name: Wait for backend
        run: sleep 5

      - name: Smoke test backend
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 2 \
            http://localhost:5000/

      - name: Remove backend container
        if: always()
        run: |
          docker rm -f backend-smoke || true


  # ============================================================
  # DOCKER SECURITY SCANNING
  # ============================================================
  docker-security-scan:
    name: Trivy Docker Security Scan
    runs-on: ubuntu-latest

    needs:
      - docker-smoke-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

          # ============================================================
  # PUSH DOCKER IMAGES TO AMAZON ECR
  # ============================================================
  docker-push-ecr:
    name: Push Docker Images to ECR
    runs-on: ubuntu-latest

    needs:
      - docker-security-scan

    # Push images only after a successful scan on main.
    # Pull requests and other branches do not push images.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Configure AWS credentials using GitHub OIDC
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --------------------------------------------------------
      # Set image information
      # --------------------------------------------------------

      - name: Set Docker image variables
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

          echo "FRONTEND_REPOSITORY=${{ steps.login-ecr.outputs.registry }}/fullstack-devops-portfolio-frontend" >> "$GITHUB_ENV"

          echo "BACKEND_REPOSITORY=${{ steps.login-ecr.outputs.registry }}/fullstack-devops-portfolio-backend" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Build frontend image
      # --------------------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t "${FRONTEND_REPOSITORY}:${IMAGE_TAG}" \
            ./frontend

      # --------------------------------------------------------
      # Build backend image
      # --------------------------------------------------------

      - name: Build backend image
        run: |
          docker build \
            -t "${BACKEND_REPOSITORY}:${IMAGE_TAG}" \
            ./backend

      # --------------------------------------------------------
      # Push frontend image
      # --------------------------------------------------------

      - name: Push frontend image
        run: |
          docker push "${FRONTEND_REPOSITORY}:${IMAGE_TAG}"

      # --------------------------------------------------------
      # Push backend image
      # --------------------------------------------------------

      - name: Push backend image
        run: |
          docker push "${BACKEND_REPOSITORY}:${IMAGE_TAG}"

      # --------------------------------------------------------
      # Display pushed images
      # --------------------------------------------------------

      - name: Display pushed image references
        run: |
          echo "=== FRONTEND IMAGE ==="
          echo "${FRONTEND_REPOSITORY}:${IMAGE_TAG}"

          echo ""
          echo "=== BACKEND IMAGE ==="
          echo "${BACKEND_REPOSITORY}:${IMAGE_TAG}"

      # ========================================================
      # BUILD FRONTEND SCAN IMAGE
      # ========================================================

      - name: Build frontend scan image
        run: |
          docker build \
            -t fullstack-devops-portfolio-frontend:scan \
            ./frontend

      # ========================================================
      # BUILD BACKEND SCAN IMAGE
      # ========================================================

      - name: Build backend scan image
        run: |
          docker build \
            -t fullstack-devops-portfolio-backend:scan \
            ./backend

      # ========================================================
      # TRIVY - FRONTEND
      # ========================================================

      - name: Scan frontend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fullstack-devops-portfolio-frontend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      # ========================================================
      # TRIVY - BACKEND
      # ========================================================

      - name: Scan backend Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fullstack-devops-portfolio-backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          format: json
          output: trivy-backend.json

      # ========================================================
      # BACKEND VULNERABILITY SUMMARY
      # ========================================================

      - name: Print backend vulnerability summary
        if: always()
        run: |
          echo "=== BACKEND VULNERABILITY SUMMARY ==="

          if [ -f trivy-backend.json ]; then
            jq -r '
              .Results[]?
              | .Vulnerabilities[]?
              | [
                  .VulnerabilityID,
                  .PkgName,
                  .InstalledVersion,
                  .FixedVersion,
                  .Severity,
                  .Title
                ]
              | @tsv
            ' trivy-backend.json
          else
            echo "No Trivy JSON report found."
          fi
